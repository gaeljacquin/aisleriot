services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - ..:/workspaces/aisleriot:cached
      # Anonymous volumes for node_modules to ensure they stay in the container
      - /workspaces/aisleriot/node_modules
      - /workspaces/aisleriot/apps/lovable/node_modules
      - /workspaces/aisleriot/apps/web/node_modules
      - /workspaces/aisleriot/apps/api/node_modules
      - /workspaces/aisleriot/packages/constants/node_modules
      - /workspaces/aisleriot/packages/ui/node_modules
      - /workspaces/aisleriot/.kilocode/node_modules
    environment:
      - COREPACK_ENABLE_STRICT=0
      - COREPACK_ENABLE_AUTO_PIN=0
    # Keep the container running
    command: sleep infinity
